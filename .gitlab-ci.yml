################################################################
# Include Pipeline Templates
include:
  - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/gitlab/pages.yaml'

################################################################
# Set any variables we need
variables:
  COMPOSER_MEMORY_LIMIT:  -1
  SHOPIFY_API_SECRET:     ThisTokenIsNotUsed

################################################################
# Defined Pipeline Stages
stages:
  - Tests
  - Docker
  - Builds

################################################################
# Functional Tests
################################################################
tests:
#    when:       manual
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.1
    stage:      Tests
    tags:       ['Dedicated']
    retry:      2
    before_script:
        ################################################################################
        # Install Symfony
        - composer update
    ################################################################################
    # Run Test Script
    script:
        # Execute Grumphp Testsuite
        - wall-e grumphp:quality
        - wall-e grumphp:stan
    ################################################################################
    # Run After Script
    after_script:
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/main/ci/after.sh | sh

################################################################
# Build Docker Hub Images
################################################################
docker-hub:
    stage:      Docker
    image:      jdrouet/docker-with-buildx
    tags:       ['Dedicated-Docker']
    services:
        - docker:dind
    before_script:
        - docker info
    script:
        - echo "Build & Upload Docker Image"
        ################################################################
        # Connect Docker to DockerHub
        - echo "$DOCKER_HUB_TOKEN" | docker login -u splashsync --password-stdin
       ################################################################
        # Build Docker Image
        - docker buildx create --use
        - docker buildx build ./ -t splashsync/toolkit:latest --platform linux/amd64,linux/arm64 --push
        - docker buildx build ./ -t splashsync/toolkit:alpine --platform linux/amd64,linux/arm64 --push
        - docker buildx build ./ -t splashsync/toolkit:3.0    --platform linux/amd64,linux/arm64 --push
    except:
        - schedules

################################################################
# Build Gitlab Docker Images
################################################################
docker-gitlab:
    stage:      Docker
    image:      docker:stable
    tags:       ['Dedicated-Docker']
    services:
      - docker:dind
    before_script:
      - docker info
    script:
      - echo "[$CI_JOB_NAME] Build & Upload Docker Alpine Image"
      ################################################################
      # Connect Docker to GitLab Registry
      - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
      ################################################################
      # Build & Push Docker Image
      - docker build ./ -t registry.gitlab.com/splashsync/toolkit:latest  --no-cache
      - docker build ./ -t registry.gitlab.com/splashsync/toolkit:alpine
      - docker build ./ -t registry.gitlab.com/splashsync/toolkit:3.0
      ################################################################
      # Push to GitLab Registry
      - docker push registry.gitlab.com/splashsync/toolkit:latest
      - docker push registry.gitlab.com/splashsync/toolkit:alpine
      - docker push registry.gitlab.com/splashsync/toolkit:3.0
    except:
      - schedules
